<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 25%, #1c1d2b 0%, #0d0e14 80%);
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .clock {
      font-size: 76px;
      font-weight: 200;
      letter-spacing: 4px;
      color: #f0f0f5;
      margin-bottom: 8px;
      text-shadow: 0 0 24px rgba(250, 30, 78, 0.2);
    }
    .date-text {
      font-size: 16px;
      color: #8b8f9e;
      margin-bottom: 40px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 13px 24px;
      width: 540px;
      max-width: 90vw;
      transition: all 0.2s ease;
    }
    .search-box:focus-within {
      border-color: #fa1e4e;
      box-shadow: 0 0 20px rgba(250,30,78,0.2);
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #f0f0f5;
      font-size: 15px;
      outline: none;
      margin-left: 12px;
    }
    .search-box input::placeholder { color: #6b6f7e; }
    .search-box svg { opacity: 0.6; }
    .shortcuts {
      display: flex;
      gap: 26px;
      margin-top: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #8b8f9e;
      font-size: 12px;
      transition: color 0.2s;
    }
    .shortcut:hover { color: #fff; }
    .shortcut-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .shortcut:hover .shortcut-icon {
      background: rgba(250,30,78,0.15);
      border-color: rgba(250,30,78,0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="clock" id="clock"></div>
  <div class="date-text" id="dateText"></div>
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" color="#8b8f9e">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search the web or enter URL..." autofocus>
  </div>
  <div class="shortcuts">
    <a class="shortcut" href="https://www.google.com">
      <div class="shortcut-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#8b8f9e"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
      </div>
      <span>Google</span>
    </a>
    <a class="shortcut" href="https://www.youtube.com">
      <div class="shortcut-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#8b8f9e"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/></svg>
      </div>
      <span>YouTube</span>
    </a>
    <a class="shortcut" href="https://github.com">
      <div class="shortcut-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#8b8f9e"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      </div>
      <span>GitHub</span>
    </a>
  </div>

  <script src="newtab.js"></script>
  <script src="content.js"></script>
</body>
</html>
